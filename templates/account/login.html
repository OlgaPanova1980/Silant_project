{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto; background: var(--white); border: 1px solid #CCCCCC; border-radius: 4px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h2 style="color: var(--primary-color); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px;">Авторизация на сервисе</h2>
    
    <form method="POST" action="{% url 'account_login' %}" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}
        
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="id_login" style="font-weight: bold; color: var(--text-color); font-size: 14px;">Имя пользователя:</label>
            <input type="text" name="login" id="id_login" placeholder="Введите логин..." required style="padding: 10px; border: 1px solid #CCCCCC; border-radius: 4px; font-size: 16px; font-family: inherit;">
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <label for="id_password" style="font-weight: bold; color: var(--text-color); font-size: 14px;">Пароль:</label>
            <input type="password" name="password" id="id_password" placeholder="Введите пароль..." required style="padding: 10px; border: 1px solid #CCCCCC; border-radius: 4px; font-size: 16px; font-family: inherit;">
        </div>
        
        {% if form.errors %}
            <div style="color: var(--accent-color); font-weight: bold; font-size: 14px; text-align: center; background: #FDE8E8; padding: 10px; border-radius: 4px; border: 1px solid var(--accent-color);">
                Неверное имя пользователя или пароль.
            </div>
        {% endif %}
        
        <button type="submit" style="background: var(--primary-color); color: var(--white); border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;">Войти</button>
    </form>
</div>
{% endblock %}
